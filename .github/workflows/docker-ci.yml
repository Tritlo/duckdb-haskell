name: Docker CI

on:
  push:
    branches:
      - main
      - docker-ci
    tags:
      - '**'
  pull_request:
    types:
      # We want to build when a draft branch is marked ready
      - ready_for_review
      # Default types
      - opened
      - reopened
      - synchronize
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout project
      uses: actions/checkout@v4

    - name: Install Nix
      if: github.event.pull_request.draft == false
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    - name: Generate bindings and verify checksums
      if: github.event.pull_request.draft == false
      run: nix-shell dev/nix/generate.nix --run 'duckdb-ffi/scripts/generate-bindings.sh --check'


    # Allows better caching of layers
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3


    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/tritlo/duckdb-ffi
        tags: |
          type=ref,event=branch,branch=main
          type=ref,event=branch,branch=docker-ci
          type=ref,event=tag
          type=sha

    # Single build step; push only when on main
    - name: Build (and conditionally push) base Docker image
      if: github.event.pull_request.draft == false
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        pull: true
        push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')) }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

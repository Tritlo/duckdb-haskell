name: Binding validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix / GHC 9.14.1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build and test both packages with Nix
        run: >-
          nix-build dev/nix/ci.nix --no-out-link
          --option sandbox true --option sandbox-fallback false
          --max-jobs 2 --cores 2

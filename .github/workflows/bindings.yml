name: Binding validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    uses: ./.github/workflows/generate-bindings.yml

  nix:
    needs: generate
    name: Nix / GHC 9.14.1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: duckdb-generated
          path: duckdb-ffi/generated/
      - name: Check the generated bindings
        working-directory: duckdb-ffi
        run: sha256sum --check generated.sha256
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build and test both packages with Nix
        run: >-
          nix-build dev/nix/ci.nix --no-out-link
          --option sandbox true --option sandbox-fallback false
          --max-jobs 2 --cores 2
